<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ball Clock">
<meta name="theme-color" content="#0b0805">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>Ball Clock</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#0b0805;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas{display:block;position:absolute;left:0;top:0}
#lbl{position:absolute;right:2.5vw;bottom:2vh;font:600 5vh "Helvetica Neue",Helvetica,Arial,sans-serif;color:#d9b36a;opacity:.85;display:none;letter-spacing:.05em;text-shadow:0 0 8px #000}
</style></head><body>
<canvas id="c"></canvas><div id="lbl"></div>
<script>
// ===== ENGINE (no DOM) =====
var W = 1000, H = 700, R = 14, SP = 30, NBALLS = 30;
function rail(lx, ly, hx, hy) { var dx = hx - lx, dy = hy - ly, L = Math.sqrt(dx * dx + dy * dy); return { lx: lx, ly: ly, hx: hx, hy: hy, ux: dx / L, uy: dy / L, len: L, tip: -1e9 }; }
var RAILS = {
  min: rail(200, 190, 820, 150),
  five: rail(830, 320, 170, 280),
  hour: rail(170, 450, 860, 410)
};
var DROPX = { min: 115, five: 885, hour: 115 };
var TRAY = { x0: 100, y0: 628, x1: 885, y1: 650 };
var LIFT = { x: 930, yb: 652, yt: 110 };
function slotPos(r, i) { var d = R + 2 + i * SP; return { x: r.lx + r.ux * d - r.uy * -(R + 3) * 0, y: r.ly + r.uy * d - (R + 3) }; }
function trayPos(i) { var t = (TRAY.x1 - R - 4 - i * (2 * R + 1) - TRAY.x0) / (TRAY.x1 - TRAY.x0); return { x: TRAY.x0 + t * (TRAY.x1 - TRAY.x0), y: TRAY.y0 + t * (TRAY.y1 - TRAY.y0) - R - 3 }; }

var balls = [], res = [], C = { min: [], five: [], hour: [] }, fixedBall, now = 0;
function mkBall() { return { x: 0, y: 0, segs: [], t0: 0, sx: 0, sy: 0 }; }
function restPos(b) {
  var i;
  if ((i = res.indexOf(b)) >= 0) return trayPos(i);
  if ((i = C.min.indexOf(b)) >= 0) return slotPos(RAILS.min, i);
  if ((i = C.five.indexOf(b)) >= 0) return slotPos(RAILS.five, i);
  if ((i = C.hour.indexOf(b)) >= 0) return slotPos(RAILS.hour, i + 1);
  if (b === fixedBall) return slotPos(RAILS.hour, 0);
  return { x: b.x, y: b.y };
}
function setup(h, m) {
  balls = []; res = []; C = { min: [], five: [], hour: [] };
  fixedBall = mkBall();
  for (var i = 0; i < NBALLS; i++) { var b = mkBall(); balls.push(b); res.push(b); }
  var h12 = h % 12 || 12, f = Math.floor(m / 5), mm = m % 5;
  for (i = 0; i < mm; i++) C.min.push(res.shift());
  for (i = 0; i < f; i++) C.five.push(res.shift());
  for (i = 0; i < h12 - 1; i++) C.hour.push(res.shift());
  var all = balls.concat([fixedBall]);
  for (i = 0; i < all.length; i++) { var p = restPos(all[i]); all[i].x = p.x; all[i].y = p.y; all[i].segs = []; }
}
// segment helpers: each ball gets a list of {x,y,d,e} relative to its own clock
function seg(b, x, y, d, e) { b.segs.push({ x: x, y: y, d: d, e: e || 'lin' }); }
function wait(b, d) { seg(b, null, null, d); }
function rollDur(x0, y0, x1, y1) { var dx = x1 - x0, dy = y1 - y0; return Math.max(250, Math.sqrt(dx * dx + dy * dy) * 1.6); }
function dump(list, railKey, T) {
  var r = RAILS[railKey];
  r.tip = now + T;
  for (var k = list.length - 1; k >= 0; k--) {
    var b = list[k], p = slotPos(r, railKey === 'hour' ? k + 1 : k), d = (list.length - 1 - k);
    b.segs = []; b.t0 = now; b.sx = b.x; b.sy = b.y;
    wait(b, T + 120 + k * 35);
    var ex = r.lx - r.ux * 6, ey = r.ly - r.uy * 6 - R - 3;
    seg(b, ex, ey, rollDur(p.x, p.y, ex, ey) * 0.5, 'in');
    seg(b, DROPX[railKey], ey + 10, 120, 'lin');
    var ty = TRAY.y0 + (DROPX[railKey] - TRAY.x0) / (TRAY.x1 - TRAY.x0) * (TRAY.y1 - TRAY.y0) - R - 3;
    seg(b, DROPX[railKey], ty, Math.sqrt(Math.max(1, ty - ey)) * 22, 'fall');
    res.push(b);
  }
}
function tick() {
  var b = res.shift(), T = 0, p, q;
  b.segs = []; b.t0 = now; b.sx = b.x; b.sy = b.y;
  seg(b, LIFT.x, LIFT.yb, 400, 'io'); T += 400;
  seg(b, LIFT.x, LIFT.yt, 2600, 'io'); T += 2600;
  var r = RAILS.min;
  seg(b, r.hx + 8, r.hy - R - 3, 300, 'io'); T += 300;
  var cx = r.hx + 8, cy = r.hy - R - 3;
  function goRail(key) {
    var r = RAILS[key], list = C[key], cap = key === 'min' ? 4 : 11, off = key === 'hour' ? 1 : 0;
    if (key !== 'min') { // drop onto high end of next rail
      var hx = r.hx - r.ux * 4, hy = r.hy - r.uy * 4 - R - 3;
      seg(b, hx, hy, 380, 'fall'); T += 380; cx = hx; cy = hy;
    }
    if (list.length < cap) {
      p = slotPos(r, list.length + off);
      var d = rollDur(cx, cy, p.x, p.y); seg(b, p.x, p.y, d, 'roll'); T += d; list.push(b); return;
    }
    // full: ball rolls to the trip slot, rail tips, contents dump
    p = slotPos(r, list.length + off);
    var d2 = rollDur(cx, cy, p.x, p.y); seg(b, p.x, p.y, d2, 'roll'); T += d2;
    var dumped = list.splice(0, list.length);
    dump(dumped, key, T);
    if (key === 'hour') { // fixed ball + this one = 12 -> 1 o'clock; carried ball returns too
      var ex = r.lx - r.ux * 6, ey = r.ly - r.uy * 6 - R - 3;
      wait(b, 140); seg(b, ex, ey, rollDur(p.x, p.y, ex, ey) * 0.5, 'in'); seg(b, DROPX.hour, ey + 10, 120);
      seg(b, DROPX.hour, TRAY.y0 + 2 - R, 400, 'fall'); res.push(b); return;
    }
    wait(b, 200); T += 200; cx = p.x; cy = p.y;
    goRail(key === 'min' ? 'five' : 'hour');
  }
  goRail('min');
}
function ease(e, t) {
  if (e === 'io') return t < .5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t);
  if (e === 'in' || e === 'fall') return t * t;
  if (e === 'roll') return t * (0.6 + 0.4 * t) ; // gentle acceleration
  return t;
}
function update(dt) {
  var all = balls.concat([fixedBall]);
  for (var i = 0; i < all.length; i++) {
    var b = all[i];
    while (b.segs.length) {
      var s = b.segs[0], el = now - b.t0;
      if (el >= s.d) { if (s.x !== null) { b.sx = s.x; b.sy = s.y; } b.x = b.sx; b.y = b.sy; b.t0 += s.d; b.segs.shift(); continue; }
      if (s.x !== null) { var k = ease(s.e, el / s.d); b.x = b.sx + (s.x - b.sx) * k; b.y = b.sy + (s.y - b.sy) * k; }
      break;
    }
    if (!b.segs.length) { var p = restPos(b), a = Math.min(1, dt / 180); b.x += (p.x - b.x) * a; b.y += (p.y - b.y) * a; }
  }
}
function readTime() { return { h: C.hour.length + 1, m: C.five.length * 5 + C.min.length }; }
if (typeof module !== 'undefined') { module.exports = { setup: setup, tick: tick, readTime: readTime, C: function () { return C; }, res: function () { return res; }, balls: function () { return balls; }, update: update, setNow: function (t) { now = t; } }; }

// ===== RENDER (DOM) =====
if (typeof document !== 'undefined') (function () {
  var cv = document.getElementById('c'), cx = cv.getContext('2d'), lbl = document.getElementById('lbl');
  var sc = 1, ox = 0, oy = 0, dpr = 1, ballSprite, shown = null, showLbl = false;
  var showLbl = true; try { showLbl = localStorage.getItem('bc_lbl') !== '0'; } catch (e) {}
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + 'px'; cv.style.height = h + 'px';
    sc = Math.min(w / W, h / H) * dpr; ox = (w * dpr - W * sc) / 2; oy = (h * dpr - H * sc) / 2;
    makeSprite();
  }
  function makeSprite() {
    var s = Math.ceil((R * 2 + 4) * sc); ballSprite = document.createElement('canvas'); ballSprite.width = ballSprite.height = s;
    var g = ballSprite.getContext('2d'), c = s / 2, r = R * sc;
    var gr = g.createRadialGradient(c - r * .4, c - r * .45, r * .05, c, c, r);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(.18, '#e8ecef'); gr.addColorStop(.5, '#8c959c'); gr.addColorStop(.85, '#3a4046'); gr.addColorStop(1, '#1b1e21');
    g.fillStyle = gr; g.beginPath(); g.arc(c, c, r, 0, 7); g.fill();
    var g2 = g.createRadialGradient(c + r * .3, c + r * .5, 0, c + r * .3, c + r * .5, r * .5);
    g2.addColorStop(0, 'rgba(230,190,120,.35)'); g2.addColorStop(1, 'rgba(230,190,120,0)'); g.fillStyle = g2; g.fill();
  }
  function woodGrad(x0, y0, x1, y1) { var g = cx.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, '#8a5a2b'); g.addColorStop(.5, '#b07a3e'); g.addColorStop(1, '#6b4220'); return g; }
  function brass(x0, y0, x1, y1) { var g = cx.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, '#f6dc8f'); g.addColorStop(.45, '#c9a046'); g.addColorStop(1, '#7a5a1c'); return g; }
  function drawRail(r, now) {
    var el = now - r.tip, ang = 0;
    if (el > 0 && el < 900) ang = -Math.sin(el / 900 * Math.PI) * 0.06 * (r.ux > 0 ? 1 : -1);
    cx.save(); cx.translate(r.hx, r.hy); cx.rotate(ang); cx.translate(-r.hx, -r.hy);
    cx.lineCap = 'round';
    cx.strokeStyle = 'rgba(0,0,0,.5)'; cx.lineWidth = 9; cx.beginPath(); cx.moveTo(r.lx, r.ly + 4); cx.lineTo(r.hx, r.hy + 4); cx.stroke();
    cx.strokeStyle = brass(0, r.ly - 4, 0, r.ly + 4); cx.lineWidth = 6; cx.beginPath(); cx.moveTo(r.lx, r.ly); cx.lineTo(r.hx, r.hy); cx.stroke();
    cx.strokeStyle = 'rgba(255,240,200,.6)'; cx.lineWidth = 1.2; cx.beginPath(); cx.moveTo(r.lx, r.ly - 2); cx.lineTo(r.hx, r.hy - 2); cx.stroke();
    // end stop at low end
    cx.fillStyle = brass(r.lx - 5, 0, r.lx + 5, 0); cx.fillRect(r.lx - 3, r.ly - 18, 6, 21);
    cx.restore();
    // pivot
    cx.fillStyle = '#3b2412'; cx.beginPath(); cx.arc(r.hx, r.hy, 6, 0, 7); cx.fill();
    cx.fillStyle = brass(r.hx - 4, r.hy - 4, r.hx + 4, r.hy + 4); cx.beginPath(); cx.arc(r.hx, r.hy, 4, 0, 7); cx.fill();
  }
  function label(t, x, y) { cx.fillStyle = 'rgba(217,179,106,.55)'; cx.font = '600 15px Georgia,serif'; cx.fillText(t, x, y); }
  function draw(now) {
    cx.setTransform(1, 0, 0, 1, 0, 0); cx.fillStyle = '#0b0805'; cx.fillRect(0, 0, cv.width, cv.height);
    cx.setTransform(sc, 0, 0, sc, ox, oy);
    var bg = cx.createRadialGradient(500, 330, 50, 500, 350, 620); bg.addColorStop(0, '#241810'); bg.addColorStop(1, '#0b0805');
    cx.fillStyle = bg; cx.fillRect(-500, -300, 2000, 1300);
    // back board
    cx.fillStyle = woodGrad(0, 60, 0, 690); cx.globalAlpha = .18; cx.fillRect(70, 60, 900, 610); cx.globalAlpha = 1;
    // posts
    cx.fillStyle = woodGrad(80, 0, 100, 0); cx.fillRect(84, 120, 14, 540);
    cx.fillStyle = woodGrad(950, 0, 970, 0); cx.fillRect(952, 80, 16, 580);
    // lift
    cx.strokeStyle = brass(LIFT.x - 26, 0, LIFT.x + 26, 0); cx.lineWidth = 4;
    cx.beginPath(); cx.moveTo(LIFT.x - 18, LIFT.yb + 14); cx.lineTo(LIFT.x - 18, LIFT.yt - 20); cx.moveTo(LIFT.x + 18, LIFT.yb + 14); cx.lineTo(LIFT.x + 18, LIFT.yt - 20); cx.stroke();
    cx.fillStyle = woodGrad(LIFT.x - 30, 0, LIFT.x + 30, 0); cx.fillRect(LIFT.x - 30, LIFT.yt - 34, 60, 14); cx.fillRect(LIFT.x - 30, LIFT.yb + 14, 60, 14);
    // labels
    label('MINUTES', 560, 120); label('FIVE MINUTES', 430, 255); label('HOURS', 470, 380);
    drawRail(RAILS.min, now); drawRail(RAILS.five, now); drawRail(RAILS.hour, now);
    // tray
    cx.fillStyle = 'rgba(0,0,0,.5)'; cx.beginPath(); cx.moveTo(TRAY.x0, TRAY.y0 + 6); cx.lineTo(TRAY.x1, TRAY.y1 + 6); cx.lineTo(TRAY.x1, TRAY.y1 + 26); cx.lineTo(TRAY.x0, TRAY.y0 + 26); cx.fill();
    cx.fillStyle = woodGrad(0, TRAY.y0, 0, TRAY.y0 + 20); cx.beginPath(); cx.moveTo(TRAY.x0, TRAY.y0); cx.lineTo(TRAY.x1 + 10, TRAY.y1); cx.lineTo(TRAY.x1 + 10, TRAY.y1 + 18); cx.lineTo(TRAY.x0, TRAY.y0 + 18); cx.fill();
    cx.fillStyle = woodGrad(0, 0, 0, 1); cx.fillRect(TRAY.x0 - 8, TRAY.y0 - 22, 10, 40);
    // base
    cx.fillStyle = woodGrad(0, 670, 0, 690); cx.fillRect(60, 672, 920, 18);
    // balls
    var all = balls.concat([fixedBall]), s = ballSprite.width / sc;
    for (var i = 0; i < all.length; i++) {
      var b = all[i];
      cx.fillStyle = 'rgba(0,0,0,.35)'; cx.beginPath(); cx.ellipse ? cx.ellipse(b.x + 2, b.y + R + 1, R * .8, 3, 0, 0, 7) : cx.arc(b.x, b.y + R, 3, 0, 7); cx.fill();
      cx.drawImage(ballSprite, b.x - s / 2, b.y - s / 2, s, s);
    }
    // fixed ball marker (brass ring)
    cx.strokeStyle = 'rgba(201,160,70,.7)'; cx.lineWidth = 2; cx.beginPath(); cx.arc(fixedBall.x, fixedBall.y, R + 2, 0, 7); cx.stroke();
  }
  var last = 0, curMin = -1;
  function sync(force) {
    var d = new Date(), key = d.getHours() * 60 + d.getMinutes();
    if (curMin < 0 || force) { setup(d.getHours(), d.getMinutes()); curMin = key; return; }
    if (key === curMin) return;
    var diff = (key - curMin + 1440) % 1440;
    if (diff === 1) tick(); else setup(d.getHours(), d.getMinutes());
    curMin = key;
  }
  function frame(t) {
    var dt = last ? Math.min(100, t - last) : 16; last = t; now = t;
    sync(false); update(dt); draw(t);
    if (showLbl) { var d = new Date(), h = d.getHours() % 12 || 12, m = d.getMinutes(); var s = h + ':' + (m < 10 ? '0' : '') + m; if (s !== shown) { lbl.textContent = s; shown = s; } }
    requestAnimationFrame(frame);
  }
  lbl.style.display = showLbl ? 'block' : 'none';
  function toggle(e) { if (e && e.preventDefault) e.preventDefault(); showLbl = !showLbl; lbl.style.display = showLbl ? 'block' : 'none'; shown = null; try { localStorage.setItem('bc_lbl', showLbl ? '1' : '0'); } catch (x) {} requestWake(); }
  document.addEventListener('touchend', toggle, false); document.addEventListener('click', toggle, false);
  window.addEventListener('resize', resize); window.addEventListener('orientationchange', function () { setTimeout(resize, 300); });
  // Wake Lock where supported
  var wl = null;
  function requestWake() { try { if (navigator.wakeLock && !wl) navigator.wakeLock.request('screen').then(function (l) { wl = l; l.addEventListener('release', function () { wl = null; }); }, function () {}); } catch (e) {} }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') { requestWake(); curMin = -1; } });
  requestWake();
  resize(); requestAnimationFrame(frame);
})();
</script></body></html>
